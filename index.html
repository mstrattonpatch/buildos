<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#182E27">
<title>BuildOS</title>
<meta name="description" content="One connected platform for construction quality, project delivery, workforce compliance and commercial management.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6' fill='%23182E27'/%3E%3Crect x='6' y='7' width='10' height='2.6' rx='1.3' fill='%23fff'/%3E%3Crect x='6' y='11.7' width='14' height='2.6' rx='1.3' fill='%23fff'/%3E%3Crect x='6' y='16.4' width='7' height='2.6' rx='1.3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* BuildOS design tokens — from "Interface & visual identity v0.1".
   Borders, not shadows, separate cards; shadow is reserved for floating UI. */
:root {
  --forest: #182e27;
  --forest-2: #21403a;
  --green: #27815f;
  --green-text: #1f6b4d;
  --green-tint: #e3f1ea;
  --amber: #c27a2c;
  --amber-text: #9a5a12;
  --amber-tint: #f8eddd;
  --red: #b94343;
  --red-tint: #f7e3e1;
  --blue: #2f5f8a;
  --blue-tint: #e4edf5;
  --canvas: #f4f5f2;
  --surface: #ffffff;
  --border: #dde1dc;
  --muted: #5f6b66;
  --ink: #16201c;

  --r-input: 6px;
  --r-card: 10px;
  --shadow-float: 0 12px 32px rgba(22, 32, 28, 0.16), 0 2px 6px rgba(22, 32, 28, 0.08);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.link { color: var(--blue); font-weight: 600; }
.link:hover { text-decoration: underline; }
.green-text { color: var(--green-text); }
.amber-text { color: var(--amber-text); }
.red-text { color: var(--red); }
.right { text-align: right; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: var(--r-input);
  border: 1px solid var(--border); background: var(--surface);
  font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: #f8f9f7; border-color: #c9cfc8; }
.btn-primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn-primary:hover { background: #20704f; border-color: #20704f; }
.btn-dark { background: var(--forest); border-color: var(--forest); color: #fff; }
.btn-dark:hover { background: #10221c; border-color: #10221c; }
.btn-danger { color: var(--red); border-color: #e7bcb8; }
.btn-danger:hover { background: var(--red-tint); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--blue); }
.btn-ghost:hover { background: var(--blue-tint); border-color: transparent; }
.btn-lg { height: 48px; padding: 0 20px; font-size: 15px; }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.btn-primary[data-pending="true"] { background: #4c9a7c; border-color: #4c9a7c; }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ----------------------------------------------------------------- badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  border: 1px solid transparent;
}
.badge svg { flex: none; }
.badge-grey { background: #eef0ed; color: var(--muted); }
.badge-outline { background: var(--surface); color: var(--ink); border-color: #b9c0b9; }
.badge-blue { background: var(--blue-tint); color: var(--blue); }
.badge-green { background: var(--green-tint); color: var(--green-text); }
.badge-amber { background: var(--amber-tint); color: var(--amber-text); }
.badge-red { background: var(--red-tint); color: var(--red); }
.badge-red-solid { background: var(--red); color: #fff; }
.badge-dashed { background: var(--surface); color: var(--muted); border: 1px dashed #a9b1aa; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 500;
}
.chip[data-active="true"] { border-color: var(--green); background: var(--green-tint); color: var(--green-text); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #eef0ed; font-size: 12px; font-weight: 500; }

/* ------------------------------------------------------------------ cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; }
.card-head h2 { font-size: 15.5px; }
.card-body { padding: 0 20px 18px; }
.grid { display: grid; gap: 16px; }
.metrics { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.metric { display: block; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--border); transition: border-color 0.12s; }
a.metric:hover { border-color: #b2bab3; }
.metric .m-label { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.metric .m-value { font-size: 26px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -0.02em; }
.metric .m-note { font-size: 12px; display: flex; align-items: center; gap: 4px; color: var(--muted); }
.metric .m-note.amber-text { color: var(--amber-text); font-weight: 600; }
.metric .m-note.red-text { color: var(--red); font-weight: 600; }

/* ----------------------------------------------------------------- tables */
.table-wrap { overflow-x: auto; }
table.register { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.register th {
  text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fafbf9; white-space: nowrap;
}
.register td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.register tr:last-child td { border-bottom: none; }
.register tbody tr:hover { background: #fafbf9; }
.register .num { text-align: right; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.register a.rowlink { font-weight: 600; }
.register a.rowlink:hover { text-decoration: underline; }
.register tfoot td { font-weight: 700; background: #fafbf9; }

/* ------------------------------------------------------------------ forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; }
.field .req { color: var(--red); }
.input, select.input, textarea.input {
  height: 40px; padding: 0 12px; border-radius: var(--r-input); border: 1px solid #c9cfc8; background: var(--surface); width: 100%;
}
textarea.input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 95, 138, 0.15); }
.input[aria-invalid="true"] { border-color: var(--red); }
.field-error { display: flex; align-items: center; gap: 6px; color: var(--red); font-size: 12.5px; }
.form-grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.form-grid .full { grid-column: 1 / -1; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-input); font-size: 13px; }
.notice-ok { background: var(--green-tint); color: var(--green-text); }
.notice-error { background: var(--red-tint); color: var(--red); }
.notice-info { background: #eef0ed; color: var(--muted); }
.notice-warn { background: var(--amber-tint); color: var(--amber-text); }

/* --------------------------------------------------------------- stepper */
.stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.step { padding: 4px 10px; border-radius: 4px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
.step[data-state="done"] { background: var(--green-tint); color: var(--green-text); border-color: transparent; }
.step[data-state="current"] { background: var(--forest); color: #fff; border-color: var(--forest); }
.stepper .sep { color: #a9b1aa; }

/* -------------------------------------------------------------- timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.timeline li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; font-size: 13px; }
.timeline .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: #a9b1aa; }
.timeline .dot.green { background: var(--green); }
.timeline .dot.blue { background: var(--blue); }
.timeline .dot.red { background: var(--red); }
.timeline .dot.amber { background: var(--amber); }

/* ------------------------------------------------------------ empty state */
.empty { padding: 28px 24px; text-align: left; }
.empty .icon { width: 40px; height: 40px; border-radius: 8px; background: var(--green-tint); color: var(--green-text); display: grid; place-items: center; margin-bottom: 12px; }

/* ------------------------------------------------------------- progress */
.bar { position: relative; height: 6px; border-radius: 3px; background: #e7eae6; overflow: hidden; }
.bar > .planned { position: absolute; inset: 0 auto 0 0; background: #c9cfc8; }
.bar > .actual { position: absolute; inset: 0 auto 0 0; background: var(--green); }

/* --------------------------------------------------------------- dropdown */
details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu .menu-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 240px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--shadow-float); padding: 6px;
}
.menu-panel a, .menu-panel button.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 6px; font-size: 13.5px;
  border: none; background: none; cursor: pointer; text-align: left;
}
.menu-panel a:hover, .menu-panel button.menu-item:hover { background: var(--canvas); }
.menu-panel .menu-label { padding: 8px 10px 4px; }

.sample-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px dashed #a9b1aa; border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }

/* ================================================================= shell */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar-col { background: var(--forest); }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--forest); color: #d7e1dc;
  display: flex; flex-direction: column; padding: 14px 10px; gap: 4px;
}
.sidebar .brand { padding: 4px 8px 14px; }
.sidebar .nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8fa59b; padding: 14px 10px 6px; }
.sidebar a.nav {
  display: flex; align-items: center; gap: 10px; padding: 0 10px; height: 36px; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: #d7e1dc;
}
.sidebar a.nav:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
.sidebar a.nav[aria-current="page"] { background: var(--green); color: #fff; }
.sidebar a.nav .count { margin-left: auto; background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.sidebar a.nav .count.quiet { background: transparent; color: #8fa59b; }
.sidebar .proj-card { margin: 6px 4px 8px; padding: 10px 12px; border-radius: 8px; background: var(--forest-2); }
.sidebar .proj-card .label { color: #8fa59b; font-size: 10.5px; }
.sidebar .recent-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--green); flex: none; }
.sidebar .bottom { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40; height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar .search { flex: 1; max-width: 420px; position: relative; }
.topbar .search input { padding-left: 36px; padding-right: 44px; background: var(--canvas); border-color: transparent; height: 38px; }
.topbar .search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.topbar .search kbd { position: absolute; right: 8px; top: 9px; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; position: relative; }
.icon-btn .pip { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #cfd8d2; color: var(--forest); font-weight: 700; font-size: 13px; display: grid; place-items: center; cursor: pointer; }
.content { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1440px; width: 100%; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-header .crumbs { margin-bottom: 4px; }
.page-header .crumbs a:hover { text-decoration: underline; }
.page-meta { margin-top: 6px; font-size: 13.5px; display: flex; gap: 18px; flex-wrap: wrap; }
.page-meta b { color: var(--ink); font-weight: 600; }
.bottom-tabs { display: none; }
.select-plain { height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 30px 0 12px; font-weight: 600; background: var(--surface); max-width: 220px; }
.proj-tabs { display: none; }

/* icon rail 768–1279 */
@media (max-width: 1279px) {
  .shell { grid-template-columns: 72px 1fr; }
  .sidebar { padding: 14px 8px; align-items: center; }
  .sidebar .nav-text, .sidebar .nav-label, .sidebar .proj-card, .sidebar .brand-text, .sidebar .count { display: none; }
  .sidebar a.nav { width: 48px; justify-content: center; padding: 0; }
  .sidebar .bottom { width: 100%; display: flex; justify-content: center; }
}
/* bottom tabs <768 */
@media (max-width: 767px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar-col { display: none; }
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar .search { min-width: 0; }
  .topbar .search input { padding-right: 8px; }
  .topbar .select-plain { max-width: 132px; }
  .topbar .spacer { display: none; }
  .topbar .search kbd, .topbar .hide-sm { display: none; }
  .content { padding: 16px 16px 96px; }
  .bottom-tabs {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
    background: var(--surface); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); min-height: 48px; justify-content: center; }
  .bottom-tabs a[aria-current="page"] { color: var(--green-text); }
  .proj-tabs { display: flex; gap: 6px; overflow-x: auto; margin: -4px 0 0; padding-bottom: 4px; }
  .proj-tabs a { flex: none; }
  .form-grid { grid-template-columns: 1fr; }
  h1 { font-size: 23px; }
}

/* ================================================================ layouts */
.cc-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.two-col { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
.po-grid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1100px) { .cc-grid, .po-grid { grid-template-columns: 1fr; } }
@media (max-width: 767px) { .two-col { grid-template-columns: 1fr; } }
.key { display: inline-block; width: 14px; height: 6px; border-radius: 3px; }
dl.kv { display: grid; grid-template-columns: 1fr auto; gap: 9px 12px; margin: 0; font-size: 13.5px; }
dl.kv dd { margin: 0; font-family: var(--mono); font-size: 13px; text-align: right; }
.task-item { display: block; padding: 10px 12px 10px 14px; border: 1px solid var(--border); border-radius: 8px; border-left: 3px solid var(--blue); }
.task-item[data-tone="red"] { border-left-color: var(--red); }
.task-item[data-tone="amber"] { border-left-color: var(--amber); }
.task-item:hover { background: #fafbf9; }
.attn { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; }
.attn[data-tone="red"] { background: var(--red-tint); border-color: #eccbc7; }
.attn .attn-icon { flex: none; }
.attn .attn-cta { margin-left: auto; font-weight: 600; color: var(--blue); white-space: nowrap; }
.attn[data-tone="red"] .attn-cta { color: var(--red); }
.ready-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.ready-row:last-child { border-bottom: none; }
.ready-row .state { margin-left: auto; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.photo-ph { background: #c5cec8; border-radius: 6px; min-height: 64px; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; }
.gantt { display: grid; grid-template-columns: 180px 1fr; font-size: 12.5px; }
.gantt .g-head { display: grid; color: var(--muted); font-size: 11.5px; padding-bottom: 6px; }
.gantt .g-head span[data-today="true"] { color: var(--ink); font-weight: 700; }
.gantt .g-name { padding: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
.gantt .g-track { position: relative; height: 30px; border-left: 1px solid var(--border); }
.gantt .g-bar { position: absolute; top: 9px; height: 12px; border-radius: 3px; }
.gantt .g-base { position: absolute; top: 23px; height: 3px; border-radius: 2px; background: #c9cfc8; }
.gantt .g-ms { position: absolute; top: 8px; width: 13px; height: 13px; transform: rotate(45deg); border-radius: 2px; }
.gantt .g-today { position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--blue); opacity: 0.5; }
@media (max-width: 767px) { .gantt { grid-template-columns: 110px 1fr; } }

/* ============================================================== site app */
.site-wrap { min-height: 100vh; display: flex; justify-content: center; background: #e7eae6; }
.site { width: 100%; max-width: 430px; min-height: 100vh; background: var(--canvas); position: relative; padding-bottom: 96px; font-size: 16px; }
.site-hero { background: var(--forest); color: #fff; padding: 18px 18px 20px; border-radius: 0 0 18px 18px; }
.site-hero .pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; font-weight: 600; font-size: 14px; border: 1px solid rgba(255,255,255,.15); }
.site-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.site-stats div { background: rgba(255,255,255,.08); border-radius: 10px; padding: 10px; text-align: center; }
.site-stats b { display: block; font-size: 22px; }
.site-stats span { font-size: 12px; color: #b9cac2; }
.site-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big-action { min-height: 92px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; font-weight: 700; font-size: 15px; }
.big-action.primary { background: var(--green); color: #fff; border-color: var(--green); }
.list-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.list-card a, .list-card .li { display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 64px; border-bottom: 1px solid var(--border); }
.list-card > :last-child { border-bottom: none; }
.li-icon { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; flex: none; }

// --------------------------------------------------------- persistence
const DB_KEY = "buildos_db_v1", USER_KEY = "buildos_user";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch { /* storage unavailable */ } },
};
let DB = (() => { try { const s = store.get(DB_KEY); if (s) return JSON.parse(s); } catch { /* corrupt — reseed */ } return createSeed(); })();
function save() {
  if (!store.set(DB_KEY, JSON.stringify(DB))) toast("Couldn't save on this device — storage is full or blocked. Changes last until you reload.", "error");
}
function resetData() { DB = createSeed(); save(); }
const nextSeq = (k) => (DB.seq[k] = (DB.seq[k] || 0) + 1);

// ------------------------------------------------------- permissions
// Role-based rules (blueprint §9). In this prototype they run in the
// browser; in production the same rules must run on the backend.
const GRANTS = {
  director: ["defect.create", "defect.assign", "defect.verify", "itp.release_hold", "variation.create", "variation.approve", "swms.review", "commercial.view", "diary.submit"],
  project_manager: ["defect.create", "defect.assign", "defect.verify", "itp.release_hold", "variation.create", "variation.approve", "swms.review", "commercial.view", "diary.submit"],
  site_supervisor: ["defect.create", "defect.assign", "defect.verify", "swms.review", "diary.submit"],
  quality_manager: ["defect.create", "defect.assign", "defect.verify", "itp.release_hold"],
  subcontractor_admin: ["defect.rectify", "variation.create"],
  worker: ["defect.create"],
};
const VARIATION_LIMIT = { project_manager: 5000000, director: Infinity };
const ROLE_LABEL = { director: "Director", project_manager: "Project manager", site_supervisor: "Site supervisor", quality_manager: "Quality manager", subcontractor_admin: "Subcontractor admin", worker: "Worker" };
class RuleError extends Error {}
const can = (u, p) => GRANTS[u.role].includes(p);
const assertCan = (u, p) => { if (!can(u, p)) throw new RuleError(`${ROLE_LABEL[u.role]}s can't do that (${p.replace(".", " → ")}).`); };

// ---------------------------------------------------------- workflows
const DEFECT_STEPS = [["open", "Open"], ["assigned", "Assigned"], ["rectifying", "Rectifying"], ["ready_for_verification", "Verify"], ["closed", "Closed"]];

function transitionDefect(d, a, u) {
  const from = d.status;
  const bad = () => new RuleError(`Can't ${words(a.type)} a defect that is ${words(from)}.`);
  const ownerOrSite = () => {
    const owner = u.role === "subcontractor_admin" && u.contractorId === d.contractorId;
    if (!owner && u.role !== "site_supervisor" && u.role !== "project_manager") throw new RuleError("Only the assigned contractor or the site team can record rectification.");
  };
  switch (a.type) {
    case "submit": assertCan(u, "defect.create"); if (from !== "draft") throw bad();
      if (!d.locationId) throw new RuleError("Choose a location before submitting.");
      return { status: "open" };
    case "assign": assertCan(u, "defect.assign"); if (from !== "open" && from !== "assigned") throw bad();
      if (!a.contractorId) throw new RuleError("Choose a responsible contractor.");
      if (!a.dueDate) throw new RuleError("A due date is needed before this can be assigned.");
      return { status: "assigned", contractorId: a.contractorId, dueDate: a.dueDate };
    case "start_rectification": if (from !== "assigned") throw bad(); ownerOrSite(); return { status: "rectifying" };
    case "submit_for_verification": if (from !== "rectifying" && from !== "assigned") throw bad(); ownerOrSite();
      if (!a.note.trim()) throw new RuleError("Describe the rectification before submitting.");
      if (!a.evidencePhotos.length) throw new RuleError("Add at least one completion photo as evidence.");
      return { status: "ready_for_verification", rectificationNote: a.note.trim(), evidencePhotos: [...d.evidencePhotos, ...a.evidencePhotos] };
    case "verify": assertCan(u, "defect.verify"); if (from !== "ready_for_verification") throw bad();
      // Closing needs evidence and an authorised reviewer, not just a status change.
      if (!d.evidencePhotos.length || !d.rectificationNote) throw new RuleError("Completion evidence is missing — can't close.");
      return { status: "closed", verifiedBy: u.id };
    case "reject": assertCan(u, "defect.verify"); if (from !== "ready_for_verification") throw bad();
      if (!a.reason.trim()) throw new RuleError("Give a reason so the contractor knows what to fix.");
      return { status: "rectifying" };
  }
  throw new RuleError("Unknown action.");
}
const isOverdue = (d, today = new Date()) => !!d.dueDate && d.status !== "closed" && d.status !== "draft" && D(d.dueDate) < startOfDay(today);

const VAR_FROM = { approve: ["submitted", "under_review"], reject: ["submitted", "under_review"], include_in_claim: ["approved"] };
function transitionVariation(v, a, u) {
  if (!VAR_FROM[a.type]?.includes(v.status)) throw new RuleError(`Can't ${words(a.type)} a variation that is ${words(v.status)}.`);
  assertCan(u, "variation.approve");

    return { status: "approved", approvedAmount: v.amount, approvedBy: u.id, approvedAt: new Date().toISOString() };
  }
  if (a.type === "reject") { if (!a.reason.trim()) throw new RuleError("A reason is required to reject a variation."); return { status: "rejected" }; }
  return { status: "included_in_claim" };
}

function commercialPosition(p, vars, lines) {
  const approvedVariations = sum(vars.filter((v) => v.status === "approved" || v.status === "included_in_claim"), (v) => v.approvedAmount ?? v.amount);
  const variationExposure = sum(vars.filter((v) => ["draft", "submitted", "under_review"].includes(v.status)), (v) => v.amount);
  const revisedContract = p.contractSum + approvedVariations;
  const forecastFinalCost = sum(lines, (l) => l.forecastFinal);
  const forecastMargin = revisedContract - forecastFinalCost;
  return {
    originalContract: p.contractSum, approvedVariations, variationExposure, revisedContract,
    budget: sum(lines, (l) => l.originalBudget), committed: sum(lines, (l) => l.committed), actual: sum(lines, (l) => l.actual),
    forecastFinalCost, forecastMargin, forecastMarginPct: revisedContract ? (forecastMargin / revisedContract) * 100 : 0,
  };
}

function credentialReq(type, c, today, mandatory) {
  if (!c) return { label: type, detail: "Not uploaded", severity: mandatory ? "blocking" : "warning" };
  if (c.expires && D(c.expires) < startOfDay(today)) return { label: type, detail: `Expired ${dayMonth(c.expires)}`, severity: "blocking" };
  if (c.status !== "verified") return { label: type, detail: "Awaiting verification", severity: mandatory ? "blocking" : "warning" };
  const days = c.expires ? daysBetween(today, D(c.expires)) : Infinity;
  if (days <= 30) return { label: type, detail: `Expires ${dayMonth(c.expires)}`, severity: "warning" };
  return { label: type, detail: "Verified", severity: "ok" };
}
/** Exact requirements for a worker to sign in — never a generic "not compliant". */
function siteRequirements(w, projectId, today = new Date()) {
  const mine = DB.credentials.filter((c) => c.workerId === w.id);
  const reqs = [credentialReq("White Card", mine.find((c) => c.type === "White Card"), today, true)];
  const inducted = w.inductedProjectIds.includes(projectId);
  reqs.push({ label: "Site induction", detail: inducted ? "Complete" : "Not yet inducted to this site", severity: inducted ? "ok" : "blocking" });
  for (const c of mine.filter((c) => c.type !== "White Card")) reqs.push(credentialReq(c.type, c, today, false));
  for (const s of DB.swms.filter((s) => s.projectId === projectId && s.contractorId === w.contractorId && s.status === "approved")) {
    const ack = s.acknowledgedBy.includes(w.id);
    reqs.push({ label: `SWMS · ${s.title} v${s.version}`, detail: ack ? "Acknowledged" : "Needs signing", severity: ack ? "ok" : "blocking" });
  }
  return reqs;
}

function search(u, q) {
  const n = q.trim().toLowerCase();
  if (!n) return [];
  const hit = (...xs) => xs.some((x) => x?.toLowerCase().includes(n));
  const out = [];
  for (const p of listProjects(u)) if (hit(p.name, p.code, p.address)) out.push(["Project", p.name, p.code, `#/app/projects/${p.id}`]);
  for (const d of listDefects(u)) if (hit(d.ref, d.title, d.trade)) out.push(["Defect", `${d.ref} · ${d.title}`, projName(d.projectId), `#/app/projects/${d.projectId}/quality/defects/${d.id}`]);
  for (const d of DB.documents) if (hit(d.number, d.title)) out.push(["Document", `${d.number} rev ${d.revision} · ${d.title}`, projName(d.projectId), `#/app/projects/${d.projectId}/documents`]);
  for (const w of DB.workers) if (hit(w.name)) out.push(["Worker", w.name, contractorOf(w.contractorId)?.tradingName ?? "", `#/app/people`]);
  for (const v of listVariations(u)) if (hit(v.ref, v.title)) out.push(["Variation", `${v.ref} · ${v.title}`, projName(v.projectId), `#/app/projects/${v.projectId}/commercial`]);
  return out.slice(0, 40);
}

function createDefect(u, inp) {

    contractorId: assign ? inp.contractorId : undefined, priority: inp.priority || "medium", dueDate: inp.dueDate || undefined,

  return inp.draft ? `${d.ref} saved as a draft.` : `${d.ref} raised${assign ? " and assigned" : ""}.`;
}

}
function releaseHoldPoint(u, itpId, pointId, decision, comment) {

  if (p.status !== "submitted") throw new RuleError("Only a submitted point can be released or rejected.");
  if (decision === "release" && !p.evidence) throw new RuleError("No evidence attached — can't release.");

function taskTone(t) {
  if (t.status === "blocked") return ["var(--red)", "blocked"];
  if (t.status === "complete") return ["#9fb8ab", "complete"];
  if (t.forecastFinish > t.baselineFinish) return ["var(--amber)", "at risk"];
  if (t.status === "in_progress") return ["var(--green)", "in progress"];
  return [t.forecastStart <= todayYmd() ? "var(--blue)" : "#c9cfc8", "starting"];
}
function gantt(tasks, fromOffset = -2, days = 14) {
  const start = startOfDay(new Date()); start.setDate(start.getDate() + fromOffset);
  const idx = (s) => Math.round((D(s) - start) / 86400000);
  const P = (i) => `${(Math.max(0, Math.min(days, i)) / days) * 100}%`;
  const today = -fromOffset;
  const cols = Array.from({ length: days }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
  const head = cols.map((d, i) => `<span data-today="${i === today}" style="visibility:${d.getDay() % 6 ? "visible" : "hidden"}">${days > 20 ? (d.getDay() === 1 ? d.getDate() : "") : `${d.toLocaleDateString("en-AU", { weekday: "narrow" })} ${d.getDate()}`}</span>`).join("");
  const rows = tasks.map((t) => {
    const s = idx(t.forecastStart), f = idx(t.forecastFinish) + 1, bs = idx(t.baselineStart), bf = idx(t.baselineFinish) + 1, [c, l] = taskTone(t);
    const bars = t.isMilestone ? `<span class="g-ms" style="left:calc(${P(s + 0.5)} - 6px);background:${c}"></span>`
      : `${f > 0 && s < days ? `<span class="g-bar" style="left:${P(s)};width:calc(${P(f)} - ${P(s)});background:${c}"></span>` : ""}${bf > 0 && bs < days ? `<span class="g-base" style="left:${P(bs)};width:calc(${P(bf)} - ${P(bs)})"></span>` : ""}`;
    return `<div class="g-name" style="font-weight:${t.isMilestone ? 700 : 500}" title="${esc(t.name)}">${esc(t.name)}</div><div class="g-track" aria-label="${esc(t.name)}: ${l}"><span class="g-today" style="left:${P(today + 0.5)}"></span>${bars}</div>`;
  }).join("");
  return `<div class="gantt"><div></div><div class="g-head" style="grid-template-columns:repeat(${days},1fr)">${head}</div>${rows}</div>`;
}
const ganttKey = () => `<div class="row wrap small muted" style="gap:14px;margin-top:12px"><span class="row" style="gap:5px"><i class="key" style="background:var(--green)"></i>In progress</span><span class="row" style="gap:5px"><i class="key" style="background:var(--amber)"></i>At risk (forecast past baseline)</span><span class="row" style="gap:5px"><i class="key" style="background:var(--blue)"></i>Starting</span><span class="row" style="gap:5px"><i class="key" style="background:var(--red);width:9px;height:9px;transform:rotate(45deg)"></i>Milestone blocked</span><span class="row" style="gap:5px"><i class="key" style="background:#c9cfc8;height:3px"></i>Baseline</span></div>`;

// ===================================================== quality
function filterDefects(u, pid, f) {
  return listDefects(u, pid).filter((d) => {
    const l = locationOf(d.locationId);
    if (f.level && l?.level !== f.level) return false;
    if (f.trade && d.trade !== f.trade) return false;
    if (f.contractor && d.contractorId !== f.contractor) return false;
    if (f.status === "overdue") { if (!isOverdue(d)) return false; }
    else if (f.status === "open") { if (d.status === "closed" || d.status === "draft") return false; }
    else if (f.status && d.status !== f.status) return false;
    if (f.q && !`${d.ref} ${d.title}`.toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  });
}

function pageDefect(u, p, id) {
  const d = getDefect(u, id);

  const base = `#/app/projects/${p.id}`, late = isOverdue(d), isSub = u.role === "subcontractor_admin" && u.contractorId === d.contractorId, site = u.role === "site_supervisor" || u.role === "project_manager";
  const kv = (k, v) => `<dt class="muted">${k}</dt><dd style="text-align:left;font-family:inherit">${v}</dd>`;
  const task = DB.tasks.find((t) => t.id === d.taskId), itp = DB.itps.find((i) => i.id === d.itpId);
  const panels = [];
  const H = hidden("defectId", d.id);
  if (d.status === "draft" && can(u, "defect.create")) panels.push(`<section class="card card-pad"><h2 style="margin-bottom:6px">Draft</h2><p class="muted small" style="margin-bottom:12px">Drafts aren't in the open register yet. Submit it when the details are right.</p>${form("defect", H + hidden("type", "submit") + '<button class="btn btn-primary">Submit defect</button>')}</section>`);
  if ((d.status === "open" || d.status === "assigned") && can(u, "defect.assign")) panels.push(`<section class="card card-pad"><h2 style="margin-bottom:12px">${d.status === "open" ? "Assign" : "Reassign"}</h2>${form("defect", `${H}${hidden("type", "assign")}<div class="stack"><label class="field"><span>Responsible contractor <span class="req">*</span></span><select name="contractorId" class="input"><option value="">Select…</option>${DB.contractors.map((c) => `<option value="${c.id}"${c.id === d.contractorId ? " selected" : ""}>${esc(c.tradingName)}</option>`).join("")}</select></label><label class="field"><span>Due date <span class="req">*</span></span><input type="date" name="dueDate" class="input" value="${d.dueDate ?? ""}" min="${todayYmd()}"></label><button class="btn btn-primary">Assign</button></div>`)}</section>`);
  if (d.status === "assigned" && (isSub || site)) panels.push(`<section class="card card-pad"><h2 style="margin-bottom:6px">Start rectification</h2><p class="muted small" style="margin-bottom:12px">Let the site team know the crew is on it.</p>${form("defect", H + hidden("type", "start_rectification") + '<button class="btn">Mark as rectifying</button>')}</section>`);
  if ((d.status === "rectifying" || d.status === "assigned") && (isSub || site)) panels.push(`<section class="card card-pad"><h2 style="margin-bottom:12px">Submit for verification</h2>${form("defect", `${H}${hidden("type", "submit_for_verification")}<div class="stack"><label class="field"><span>What was done <span class="req">*</span></span><textarea name="note" class="input" placeholder="e.g. Membrane relapped 150mm up hob, cured 24h"></textarea></label><label class="field"><span>Completion photos <span class="req">*</span></span><input type="file" name="evidence" accept="image/*" multiple class="input" style="padding-top:7px"></label><button class="btn btn-dark">Submit for review</button></div>`)}</section>`);
  if (d.status === "ready_for_verification" && can(u, "defect.verify")) panels.push(`<section class="card card-pad"><h2 style="margin-bottom:6px">Verify repair</h2><p class="muted small" style="margin-bottom:12px">Closing needs your sign-off on the evidence. Rejecting sends it back to rectification.</p>
    ${form("defect", H + hidden("type", "verify") + '<button class="btn btn-primary">Verify &amp; close</button>', `data-confirm="Verify and close ${d.ref}? This is recorded against your name."`)}
    <div style="margin-top:14px">${form("defect", `${H}${hidden("type", "reject")}<div class="stack"><label class="field"><span>Reason for rejecting</span><textarea name="reason" class="input" placeholder="What still needs fixing?"></textarea></label><button class="btn btn-danger">Request changes</button></div>`)}</div></section>`);
  if (d.status === "closed") panels.push(`<section class="card card-pad"><h2 style="margin-bottom:6px">Closed</h2><p class="muted small">Verified by ${esc(userById(d.verifiedBy)?.name ?? "reviewer")}. The record stays in the register for audit and the defect liability period.</p></section>`);
  if (!panels.length) panels.push(`<section class="card card-pad"><p class="muted small">Nothing for you to do here as ${ROLE_LABEL[u.role].toLowerCase()}.</p></section>`);
  return `${pageHeader({ crumbs: [[base, p.name], [`${base}/quality`, "Quality"]], title: `<span class="mono" style="font-size:20px;color:var(--muted);margin-right:10px">${d.ref}</span>${esc(d.title)}`, meta: `<span class="row" style="gap:8px">${late ? badge("overdue") : ""}${badge(d.status)}</span>` })}
  <section class="card card-pad">${stepper(DEFECT_STEPS, d.status === "draft" ? "open" : d.status)}</section>
  <div class="cc-grid">
    <div class="stack-lg" style="min-width:0">
      <section class="card"><div class="card-head"><h2>Details</h2></div><div class="card-body">

        <h3 style="margin:18px 0 8px">Photos</h3>${d.photos.length ? `<div class="photo-grid">${d.photos.map((s) => photoTile(s, "min-height:96px")).join("")}</div>` : '<p class="muted small">No photos attached.</p>'}
        ${d.rectificationNote ? `<h3 style="margin:18px 0 8px">Rectification</h3><p>${esc(d.rectificationNote)}</p><div class="photo-grid" style="margin-top:8px">${d.evidencePhotos.map((s) => photoTile(s, "min-height:96px;background-color:#a9c3b6")).join("")}</div>` : ""}
      </div></section>
      <section class="card"><div class="card-head"><h2>History</h2></div><div class="card-body"><ul class="timeline">
        ${auditFor(d.id).filter((a) => a.action !== "Defect raised").map((a) => `<li><span class="dot ${/closed|verified/i.test(a.action) ? "green" : /reject/i.test(a.action) ? "red" : "blue"}"></span><div><b style="font-weight:600">${esc(a.action)}</b> by ${esc(userById(a.actorId)?.name)}${a.detail ? ` · ${esc(a.detail)}` : ""} · <span class="muted">${dateTime(a.at)}</span>${a.from && a.to && a.from !== a.to ? `<div class="muted small">${words(a.from)} → ${words(a.to)}</div>` : ""}</div></li>`).join("")}

function pageItp(u, p, id) {

  const base = `#/app/projects/${p.id}`, task = DB.tasks.find((t) => t.id === itp.taskId), mayRelease = can(u, "itp.release_hold");

    ${pt.status === "released" ? `<span class="small muted">Released by ${esc(userById(pt.releasedBy)?.name)} · ${pt.releasedAt ? dateTime(pt.releasedAt) : ""}</span>` : ""}
    ${pt.status === "submitted" && mayRelease ? form("hold", `${hidden("itpId", itp.id)}${hidden("pointId", pt.id)}<div class="stack" style="gap:8px"><input name="comment" class="input" placeholder="Comment (required to reject)" style="height:34px"><div class="row"><button class="btn btn-primary" name="decision" value="release">${pt.type === "hold" ? "Release hold point" : "Accept"}</button><button class="btn btn-danger" name="decision" value="reject">Reject</button></div></div>`, `data-confirm="${pt.type === "hold" ? "Release this hold point" : "Accept this point"}? Your name and the time are recorded." data-confirm-for="release"`) : ""}

}

// ===================================================== session & routing
const currentUser = () => userById(store.get(USER_KEY) || "") || null;
const HOME = { u_dir: "/app", u_pm: "/app/projects/p_riv", u_sup: "/site", u_qm: "/app/projects/p_riv/quality", u_sub: "/app/projects/p_riv/quality", u_wkr: "/site/sign-in" };
const go = (path) => { if (location.hash === "#" + path) render(); else location.hash = path; };

function parseRoute() {
  const raw = decodeURIComponent(location.hash.slice(1)) || "/";
  const [path, qs] = raw.split("?");
  return { path: path.replace(/\/+$/, "") || "/", query: Object.fromEntries(new URLSearchParams(qs || "")) };
}

function resolve(path, query) {
  const pub = { "/": [pageHome, "Everything on site. Everything under control."], "/pricing": [pagePricing, "Pricing"], "/security": [pageSecurity, "Security & privacy"], "/demo": [pageDemo, "Book a demo"], "/login": [pageLogin, "Log in"] };
  if (pub[path]) return { html: pub[path][0](), title: pub[path][1] };
  const u = currentUser();
  if (!u) { go("/login"); return null; }
  if (path === "/site") return { html: pageSiteToday(u, path), title: "Site app" };
  if (path === "/site/defect") return { html: pageSiteDefect(u), title: "New defect" };
  if (path === "/site/sign-in") return { html: pageSiteSignIn(u, path), title: "Site sign-in" };
  const company = { "/app": [pageControlCentre, "Company overview"], "/app/projects": [pageProjects, "Projects"], "/app/tasks": [pageTasks, "My tasks"], "/app/people": [pagePeople, "People & contractors"], "/app/reports": [(x) => pageReports(x, query), "Reports"], "/app/search": [(x) => pageSearch(x, query), "Search"], "/app/settings": [pageSettings, "Settings"] };
  if (company[path]) return { html: appShell(u, path, company[path][0](u)), title: company[path][1] };
  const m = path.match(/^\/app\/projects\/([^/]+)(?:\/(.*))?$/);
  if (m) {
    const p = getProject(u, m[1]);
    if (!p) return { html: appShell(u, path, notFound()), title: "Not found" };
    const sub = m[2] || "";
    let html, title = p.name, mm;
    if (sub === "") html = pageProject(u, p);
    else if (sub === "quality") { html = pageQuality(u, p, { q: query.q || "", level: query.level || "", trade: query.trade || "", contractor: query.contractor || "", status: query.status || "" }); title = "Quality"; }
    else if (sub === "quality/new") { html = pageNewDefect(u, p); title = "New defect"; }
    else if ((mm = sub.match(/^quality\/defects\/(.+)$/))) { html = pageDefect(u, p, mm[1]); title = "Defect"; }
    else if ((mm = sub.match(/^quality\/itp\/(.+)$/))) { html = pageItp(u, p, mm[1]); title = "ITP"; }
    else if (sub === "programme") { html = pageProgramme(u, p); title = "Programme"; }
    else if (sub === "commercial") { html = pageCommercial(u, p); title = "Commercial"; }
    else if (sub === "safety") { html = pageSafety(u, p); title = "Safety"; }
    else if (sub === "workforce") { html = pageWorkforce(u, p); title = "Workforce"; }
    else if (sub === "documents") { html = pageDocuments(u, p); title = "Documents"; }
    else if (sub === "diary") { html = pageDiary(u, p); title = "Site diary"; }
    else if (sub === "reports") html = pagePlaceholder(p, "Project reports", "chart", "Weekly project summary, quality trends, labour hours by trade and cost reports — every metric with a written definition. Planned for phase 5.");
    else if (sub === "handover") html = pagePlaceholder(p, "Handover", "package", "Compile outstanding defects, inspections, certificates and warranties into an audit-ready handover pack, then manage the defect liability period. Planned for phase 5.");
    else html = notFound();
    return { html: appShell(u, path, html), title };
  }
  return { html: appShell(u, path, notFound()), title: "Not found" };
}

let pendingScroll = null;
function render() {
  const { path, query } = parseRoute();
  let out;
  try { out = resolve(path, query); }
  catch (e) {
    if (!(e instanceof RuleError)) throw e;
    const u = currentUser();
    out = { html: u ? appShell(u, path, notFound(e.message)) : pageLogin(), title: "Not allowed" };
  }
  if (!out) return;
  document.getElementById("root").innerHTML = out.html;
  document.title = `${out.title} · BuildOS`;
  if (pendingScroll) { document.getElementById(pendingScroll)?.scrollIntoView(); pendingScroll = null; }
  else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

// ===================================================== feedback
function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast toast-${kind}`;
  el.setAttribute("role", kind === "ok" ? "status" : "alert");
  el.innerHTML = `${icon(kind === "ok" ? "checkcircle" : "alert")}<span>${esc(msg)}</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("out"), 3200);
  setTimeout(() => el.remove(), 3700);
}
function formError(formEl, msg) {
  const box = formEl.querySelector(":scope > .form-msg");
  box.innerHTML = `<div class="notice notice-error" role="alert" style="margin-top:10px">${icon("alert")}<span>${esc(msg)}</span></div>`;
}

/** Downscale photos to small JPEG thumbnails so they fit in browser storage. */
async function readPhotos(input, max = 4) {
  const files = [...(input?.files || [])].slice(0, max);
  return Promise.all(files.map((f) => new Promise((res) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 360 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(""); };
    img.src = url;
  })));
}

// ===================================================== actions
// Each returns a success message, or throws RuleError (shown inline).
const ACTIONS = {
  async createDefect(fd, u, el) {
    const draft = fd.get("mode") === "draft";
    const photos = (await readPhotos(el.querySelector("[data-photo-input]"))).filter(Boolean);
    const msg = createDefect(u, { projectId: fd.get("projectId"), title: fd.get("title") || "", locationId: fd.get("locationId") || "", room: fd.get("room") || "", trade: fd.get("trade") || "", contractorId: fd.get("contractorId") || "", priority: fd.get("priority"), dueDate: fd.get("dueDate") || "", photos, draft });
    return { msg, go: el.dataset.done };
  },
  async defect(fd, u, el) {
    const type = fd.get("type"), id = fd.get("defectId");
    const a = type === "assign" ? { type, contractorId: fd.get("contractorId"), dueDate: fd.get("dueDate") }
      : type === "submit_for_verification" ? { type, note: fd.get("note") || "", evidencePhotos: (await readPhotos(el.querySelector('[name="evidence"]'))).map((x) => x || "") }
      : type === "reject" ? { type, reason: fd.get("reason") || "" } : { type };
    return actOnDefect(u, id, a);
  },
  variation: (fd, u) => actOnVariation(u, fd.get("variationId"), { type: fd.get("type"), reason: fd.get("reason") || "" }),
  hold: (fd, u) => releaseHoldPoint(u, fd.get("itpId"), fd.get("pointId"), fd.get("decision"), fd.get("comment") || ""),
  swms: (fd, u) => reviewSwms(u, fd.get("swmsId"), fd.get("decision"), fd.get("comment") || ""),
  swmsAck: (fd, u) => acknowledgeSwms(u, fd.get("swmsId")),
  siteIn: (fd, u) => signInToSite(u, fd.get("projectId")),
  siteOut: (fd, u) => signOutOfSite(u, fd.get("projectId")),
  diary: (fd, u) => submitDiary(u, fd.get("projectId"), { weather: fd.get("weather") || "", notes: fd.get("notes") || "", delays: fd.get("delays") || "" }),
  demo(fd) {
    if (!fd.get("name") || !/.+@.+\..+/.test(fd.get("email") || "")) throw new RuleError("Add your name and a valid work email.");
    return { msg: "Thanks — this prototype doesn't send the request anywhere yet. Connect it to your inbox or CRM before launch.", stay: true };
  },
};

document.addEventListener("submit", async (e) => {
  const el = e.target;
  if (el.matches("[data-search]")) { e.preventDefault(); go(`/app/search?q=${encodeURIComponent(el.q.value)}`); return; }
  if (el.matches("[data-filter]")) {
    e.preventDefault();
    const qs = new URLSearchParams([...new FormData(el)].filter(([, v]) => v)).toString();
    go(el.dataset.filter.slice(1) + (qs ? `?${qs}` : "")); return;
  }
  if (!el.dataset.act) return;
  e.preventDefault();
  const sub = e.submitter;
  if (el.dataset.confirm && (!el.dataset.confirmFor || sub?.value === el.dataset.confirmFor) && !confirm(el.dataset.confirm)) return;
  const fd = new FormData(el, sub);
  const u = currentUser();
  const buttons = el.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  try {
    const r = await ACTIONS[el.dataset.act](fd, u, el);
    const res = typeof r === "string" ? { msg: r } : r;
    if (res.stay) { el.innerHTML = `<div class="notice notice-ok">${icon("checkcircle")}<span>${esc(res.msg)}</span></div>`; return; }
    save();
    toast(res.msg);
    const keep = el.closest("tr")?.id;
    if (res.go) go(res.go.slice(1)); else { pendingScroll = keep || null; const y = window.scrollY; render(); if (!keep) window.scrollTo(0, y); }
  } catch (err) {
    buttons.forEach((b) => (b.disabled = false));
    if (err instanceof RuleError) formError(el, err.message); else { console.error(err); formError(el, "Something went wrong. Please try again."); }
  }
});

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-login],[data-reset],[data-signout],[data-export],[data-qr],[data-scroll],[data-upload-licence]");
  // Close open menus when clicking elsewhere.
  document.querySelectorAll("details.menu[open]").forEach((d) => { if (!d.contains(e.target) || t) d.removeAttribute("open"); });
  if (!t) return;
  if (t.dataset.login) { store.set(USER_KEY, t.dataset.login); go(t.dataset.next || HOME[t.dataset.login] || "/app"); }
  else if ("reset" in t.dataset) { if (confirm("Reset all sample data on this device? Your changes will be lost.")) { resetData(); toast("Sample data reset."); render(); } }
  else if ("signout" in t.dataset) { store.del(USER_KEY); go("/login"); }
  else if (t.dataset.export) exportDefects(t.dataset.export);
  else if ("qr" in t.dataset) alert("QR location scanning uses the phone camera — planned for the installable app build.");
  else if ("uploadLicence" in t.dataset) alert("Credential uploads go to a reviewer for verification — planned with file storage.");
  else if (t.dataset.scroll) { e.preventDefault(); if (parseRoute().path !== "/") { pendingScroll = t.dataset.scroll; go("/"); } else document.getElementById(t.dataset.scroll)?.scrollIntoView({ behavior: "smooth" }); }
});

document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.matches("[data-switch]")) {
    const { path } = parseRoute(), cur = path.match(/^\/app\/projects\/([^/]+)(\/[^/]+)?/);
    go(el.value ? `/app/projects/${el.value}${cur?.[2] && !/defects|itp|new/.test(path) ? cur[2] : ""}` : "/app");
  }
  if (el.matches("[data-photo-input]")) {
    const f = el.closest("form"), shots = (await readPhotos(el)).filter(Boolean);
    f.querySelectorAll("[data-preview]").forEach((p, i) => { if (shots[i]) { p.style.background = `center/cover url(${shots[i]})`; p.textContent = ""; } });
    f.querySelector("[data-photo-count]").textContent = shots.length ? `${shots.length} photo${shots.length > 1 ? "s" : ""} attached` : "";
  }
});

// Keyboard: "/" focuses search.
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement?.tagName || "")) { const q = document.getElementById("q"); if (q) { e.preventDefault(); q.focus(); } }
});
const refreshOnline = () => document.querySelectorAll("[data-online-pill]").forEach((p) => (p.innerHTML = navigator.onLine ? `<span class="badge badge-green">${icon("check", 12)}Online</span>` : badge("offline")));
window.addEventListener("online", refreshOnline);
window.addEventListener("offline", refreshOnline);

function exportDefects(pid) {
  const u = currentUser(), p = getProject(u, pid);
  const { query } = parseRoute();
  const rows = filterDefects(u, pid, query);
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [["ID", "Title", "Location", "Trade", "Contractor", "Priority", "Due", "Status"].join(","), ...rows.map((d) => [d.ref, d.title, locationLabel(d), d.trade, contractorOf(d.contractorId)?.tradingName, d.priority, d.dueDate, d.status].map(q).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `${p.code}-defects.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

render();
