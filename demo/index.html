<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#182E27">
<title>Setout demo</title>
<meta name="description" content="Try Setout with a sample building company. Runs entirely in your browser; nothing is sent anywhere.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='6.5' fill='%23182E27'/%3E%3Cpath d='M13 13V5.5A7.5 7.5 0 0 1 20.5 13Z' fill='%237FC4A5'/%3E%3Ccircle cx='13' cy='13' r='7.5' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app/styles.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="demo-bar" role="region" aria-label="Demo">
  <a href="../" aria-label="Back to the Setout website">← Back to website</a>
  <span class="demo-tag">Demo</span>
  <span class="demo-who" data-demo-who></span>
  <span class="spacer"></span>
  <button type="button" data-demo-switch>Switch role</button>
  <button type="button" data-demo-reset title="Put the sample data back"><span class="demo-reset-label">Reset demo</span><span aria-hidden="true" class="demo-reset-icon">↺</span></button>
  <a class="demo-cta" href="../#/demo">Book a demo</a>
</div>
<div id="root"></div>
<noscript>The Setout demo needs JavaScript to run.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="demo.js"></script>
</body>
</html>
